<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanHacks - Download the App</title>
    <style>
        :root {
            /* CleanHacks Brand Colors */
            --bg-color: #F4F1EA;      /* Soft beige */
            --text-color: #334155;    /* Deep charcoal/slate */
            --accent-color: #799C83;  /* Sage green */
            --card-bg: #FFFFFF;       /* Clean white for the central card */
            --muted-text: #64748b;    /* Muted slate for secondary text */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 480px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid rgba(121, 156, 131, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background-color: var(--accent-color);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(121, 156, 131, 0.3);
        }
        
        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--muted-text);
            margin-bottom: 28px;
            max-width: 320px;
        }

        .qr-wrapper {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 16px;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            display: block;
        }

        .domain-link {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .domain-link:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--muted-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Brand Badge -->
        <div class="icon-badge">✨</div>

        <h1>CleanHacks</h1>
        <p class="subtitle">Scan the QR code with your mobile device to open or download the app.</p>

        <!-- QR Code Container -->
        <div class="qr-wrapper">
            <img 
                src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://cleanhacks.projevity.com.au&color=334155" 
                alt="Scan to open CleanHacks" 
            />
        </div>

        <a href="https://cleanhacks.projevity.com.au" class="domain-link">cleanhacks.projevity.com.au</a>
    </div>

    <footer>
        &copy; Projevity. All rights reserved.
    </footer>

</body>
</html>
